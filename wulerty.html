<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прыгающие квадраты с аватаркой</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #1a2a3a, #0d1b2a);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    .playground {
      position: relative;
      width: 90vw;
      max-width: 1100px;
      height: 80vh;
      max-height: 700px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(4px);
      border-radius: 3rem;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      align-items: center;
      padding: 20px;
    }

    /* карточка-квадрат с закруглениями и аватаркой */
    .bouncer {
      width: 130px;
      height: 130px;
      background: #2e3f4f;
      border-radius: 32px;
      box-shadow: 0 10px 0 #0f1a22, 0 12px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.05s ease;
      cursor: default;
      flex-shrink: 0;
      /* анимация прыжка + отскок */
      animation: bounce 1.4s cubic-bezier(0.22, 1, 0.36, 1) infinite alternate;
      transform-origin: bottom;
      will-change: transform;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    /* внутренний контейнер для картинки — сохраняем пропорции и скругляем */
    .bouncer img {
      width: 85%;
      height: 85%;
      object-fit: cover;
      border-radius: 24px;
      background: #1e2d3a;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
      display: block;
      transition: transform 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* кастомная анимация: прыжок вверх + "приземление" с отскоком */
    @keyframes bounce {
      0% {
        transform: translateY(0px) scale(1, 1);
        animation-timing-function: cubic-bezier(0.33, 1.3, 0.6, 1);
      }
      20% {
        transform: translateY(-30px) scale(1.02, 0.98);
        animation-timing-function: cubic-bezier(0.2, 0.9, 0.4, 1.2);
      }
      40% {
        transform: translateY(-60px) scale(1.04, 0.94);
        animation-timing-function: cubic-bezier(0.1, 0.7, 0.3, 1.1);
      }
      55% {
        transform: translateY(-80px) scale(1.06, 0.92);
        animation-timing-function: cubic-bezier(0.15, 0.8, 0.3, 1);
      }
      70% {
        transform: translateY(-50px) scale(1.02, 0.96);
        animation-timing-function: cubic-bezier(0.3, 1.1, 0.5, 1);
      }
      85% {
        transform: translateY(-20px) scale(1, 1.02);
        animation-timing-function: cubic-bezier(0.4, 1.2, 0.6, 1);
      }
      100% {
        transform: translateY(0px) scale(1, 1);
        animation-timing-function: cubic-bezier(0.5, 1.4, 0.7, 1);
      }
    }

    /* разная задержка для каждого квадрата — хаотичный прыжок */
    .bouncer:nth-child(1) { animation-delay: 0.0s; background: #3d5063; }
    .bouncer:nth-child(2) { animation-delay: 0.18s; background: #2f4052; }
    .bouncer:nth-child(3) { animation-delay: 0.45s; background: #405568; }
    .bouncer:nth-child(4) { animation-delay: 0.9s; background: #34495e; }
    .bouncer:nth-child(5) { animation-delay: 0.3s; background: #2c3e50; }
    .bouncer:nth-child(6) { animation-delay: 0.7s; background: #3a4f62; }
    .bouncer:nth-child(7) { animation-delay: 0.12s; background: #4a5f72; }
    .bouncer:nth-child(8) { animation-delay: 0.55s; background: #2d4055; }
    .bouncer:nth-child(9) { animation-delay: 0.8s; background: #3d5368; }
    .bouncer:nth-child(10) { animation-delay: 0.25s; background: #33485d; }
    .bouncer:nth-child(11) { animation-delay: 1.0s; background: #4a6176; }
    .bouncer:nth-child(12) { animation-delay: 0.38s; background: #2a3f54; }

    /* делаем отзывчивость: при малом экране квадраты чуть меньше */
    @media (max-width: 600px) {
      .bouncer {
        width: 90px;
        height: 90px;
        border-radius: 24px;
      }
      .bouncer img {
        border-radius: 18px;
      }
      .playground {
        padding: 15px;
        gap: 10px;
        height: 90vh;
      }
    }

    @media (max-width: 440px) {
      .bouncer {
        width: 70px;
        height: 70px;
        border-radius: 18px;
      }
      .bouncer img {
        border-radius: 12px;
      }
    }

    /* для красоты — легкий свечение при наведении */
    .bouncer:hover {
      filter: brightness(1.2) drop-shadow(0 0 12px #7fadcf);
      transition: filter 0.2s;
    }

    /* подпись в углу (необязательно, но атмосферно) */
    .watermark {
      position: absolute;
      bottom: 16px;
      right: 24px;
      color: rgba(255, 255, 255, 0.15);
      font-size: 0.8rem;
      letter-spacing: 1px;
      pointer-events: none;
      font-weight: 300;
      backdrop-filter: blur(2px);
      padding: 6px 14px;
      border-radius: 40px;
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.03);
    }
  </style>
</head>
